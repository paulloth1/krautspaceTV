<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/display.css">
</head>
<body>
  <div id="slide">
    <div id="slide-a" class="slide-buffer visible"><div class="slide slide-empty"><h2>Loading&hellip;</h2></div></div>
    <div id="slide-b" class="slide-buffer"></div>
  </div>

  <script>
    (function () {
      var POLL_MS = 5000;
      var IFRAME_RESET_MS = 30000; // reset scroll position on cross-origin iframes we can't control directly
      // A slide can opt out by marking its iframe data-no-reset (see media.py's
      // no_reset config field) - some embeds (e.g. a chat client that has to
      // reconnect/rejoin from scratch) take longer than IFRAME_RESET_MS to
      // finish loading on the Pi's weak CPU, so periodic resets would prevent
      // them from ever finishing instead of just fixing their scroll position.
      var READY_TIMEOUT_MS = 15000; // don't wait forever for a slow/broken resource before showing it anyway
      var IFRAME_SETTLE_MS = 10000; // iframe "load" fires on initial shell load, before JS apps inside finish fetching their own data
      var FADE_MS = 5000; // must match the opacity transition duration in display.css

      var active = document.getElementById("slide-a");
      var standby = document.getElementById("slide-b");
      var lastId; // undefined = never set yet, so first fetch always renders
      var lastHtml = null;
      var lastForced = false;
      var resetTimer = null;
      var pendingGen = 0;

      function reportVisible() {
        // Let the backend know a slide has actually finished fading in, so
        // admin UIs can show what's really on screen instead of the rotation
        // target (which can be well ahead during the load/fade buffering).
        var qs = "forced=" + (lastForced ? "true" : "false");
        if (lastId !== null && lastId !== undefined) {
          qs += "&id=" + encodeURIComponent(lastId);
        }
        fetch("/api/slide/visible?" + qs, { method: "POST" }).catch(function () {});
      }

      function swapToStandby() {
        standby.classList.add("visible");
        active.classList.remove("visible");
        var justHidden = active;
        active = standby;
        standby = justHidden;
        armIframeReset();
        reportVisible();
        // Give the fade time to finish, then clear the hidden buffer to free
        // up any iframe/video resources it was holding.
        setTimeout(function () {
          standby.innerHTML = "";
        }, FADE_MS + 100);
      }

      function showHtml(htmlStr, immediate) {
        var gen = ++pendingGen;
        standby.innerHTML = htmlStr;
        var media = standby.querySelector("iframe, img");
        if (!media || immediate) {
          swapToStandby();
          return;
        }

        var done = false;
        function onReady() {
          if (done || gen !== pendingGen) {
            return; // superseded by a newer slide/reset before this one finished loading
          }
          done = true;
          swapToStandby();
        }
        function onLoad() {
          // For iframes, give the embedded page's own JS a moment to fetch and
          // render its actual content before we reveal it — "load" only means
          // the initial document finished, not that a JS-driven app is done.
          if (media.tagName === "IFRAME") {
            setTimeout(onReady, IFRAME_SETTLE_MS);
          } else {
            onReady();
          }
        }
        media.addEventListener("load", onLoad, { once: true });
        media.addEventListener("error", onReady, { once: true });
        setTimeout(onReady, READY_TIMEOUT_MS);
      }

      function armIframeReset() {
        if (resetTimer) {
          clearInterval(resetTimer);
          resetTimer = null;
        }
        var resettableIframe = active.querySelector("iframe:not([data-no-reset])");
        if (resettableIframe) {
          resetTimer = setInterval(function () {
            // Reload through the same hidden-load-then-fade path used for
            // rotation, rather than mutating the visible iframe in place
            // (which would flash its loading state with no transition).
            showHtml(lastHtml);
          }, IFRAME_RESET_MS);
        }
      }

      function applySlide(data) {
        if (data.id === lastId && data.html === lastHtml) {
          return; // same slide already showing, don't touch the DOM (avoids img/video reload flicker)
        }
        lastId = data.id;
        lastHtml = data.html;
        lastForced = !!data.forced;
        showHtml(data.html, data.forced);
      }

      function poll() {
        fetch("/api/slide/current", { cache: "no-store" })
          .then(function (resp) {
            if (!resp.ok) throw new Error("bad response");
            return resp.json();
          })
          .then(applySlide)
          .catch(function () {
            // Network hiccup or backend restart: keep showing whatever is on
            // screen and just try again on the next tick.
          });
      }

      poll();
      setInterval(poll, POLL_MS);
    })();
  </script>
</body>
</html>
