# Install: sudo mkdir -p /etc/systemd/system/plymouth-quit.service.d && \
#   sudo cp deploy/plymouth-quit-retain-splash.conf /etc/systemd/system/plymouth-quit.service.d/override.conf && \
#   sudo systemctl daemon-reload
#
# Default plymouth-quit.service (WantedBy=multi-user.target) runs a plain
# `plymouth quit`, which blanks the display immediately — and it fires well
# before kiosk.service's own ExecStartPre gets a chance to run (kiosk.service
# also waits on the backend readiness check first), leaving the console
# exposed for several seconds before Xorg/Chromium paint anything. This makes
# it retain the splash's last frame instead, same as kiosk.service's own
# plymouth quit call, so whichever one wins the race, the screen never goes
# blank in between.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
