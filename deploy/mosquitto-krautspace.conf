# Install: sudo cp deploy/mosquitto-krautspace.conf /etc/mosquitto/conf.d/krautspace.conf && \
#   sudo systemctl restart mosquitto
#
# Anonymous, LAN-reachable broker for the api_status slide's MQTT source
# (see README) and for anyone in the space to publish sensor/status data to.
# Same "intentionally open" call as the admin UI itself - no auth, so
# nothing beyond the LAN boundary should ever be trusted to publish here.
listener 1883 0.0.0.0
allow_anonymous true
